/* ===== Tema C · Bento (violeta + lima) ===== */
:root{--ink:#14142b;--mut:#6a6c85;--line:#e6e8f2;--bg:#eef0f6;--pri:#5b3df5;--priBg:#ece8ff;--ok:#3d6a05;--okBg:#e3f7c4;--warn:#9a4a07;--warnBg:#fff1e0;--bad:#e0334d;--badBg:#ffe3e7;--lime:#c8f169}

header.top{background:rgba(238,240,246,.88);border-bottom:0}.logo{font-weight:800;letter-spacing:-.03em;font-size:1.25rem}
h1,h2,.lt,.wh,.sh{letter-spacing:-.035em;font-weight:800}
button,.btn{background:#e4e6f0;color:var(--ink);border-radius:14px;font-weight:700}button:hover{background:#d9dceb}
button.pri{background:var(--pri);color:#fff;box-shadow:0 8px 22px rgba(91,61,245,.32)}button.pri:hover{background:#4b2fe0}

<script>
/* Criar Escala v2 — motor de cálculo (demonstrativo).
 * Sem dependências. Funciona no navegador (window.Engine) e no Node (module.exports).
 *
 * Modelo:
 *   cfg = {
 *     month:'2026-11',
 *     week:[ {open:bool,start:min,end:min} x7 ]   // índice 0 = domingo
 *     exceptions:{ [dia]: true|false }            // true = abre, false = fechado (sobrepõe a semana)
 *     holidays:[{day,name}]                       // só informativo; o efeito vem de exceptions
 *     work:min, daysPerWeek:n, brk:min            // jornada diária (sem intervalo), dias/sem, intervalo
 *     need:{ _: n } ou { Caixa: 2, Estoque: 1 }    // mínimo simultâneo por função
 *     people:[{id,name,role,blockedWd:[0..6],entry:min|null}]
 *   }
 */
(function (root) {
  const GRID = 30; // passo de candidatos de entrada (min)
  const BRK_STEP = 15;

  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (m) => { if (m === 1440) return '24:00'; const x = ((m % 1440) + 1440) % 1440; return `${pad(Math.floor(x / 60))}:${pad(x % 60)}`; };
  const fmtH = (m) => { const h = Math.floor(m / 60), r = Math.round(m % 60); return r ? `${h}h${pad(r)}` : `${h}h`; };

  function daysInMonth(month) { const [y, m] = month.split('-').map(Number); return new Date(y, m, 0).getDate(); }
  function wdOf(month, d) { const [y, m] = month.split('-').map(Number); return new Date(y, m - 1, d).getDay(); }

  // Feriados nacionais fixos + Sexta-feira da Paixão (comum, mas depende de lei local).
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
      f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
      i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
      mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }
  const FIXED = [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'],
    ['09-07', 'Independência'], ['10-12', 'N. Sra. Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'],
    ['11-20', 'Consciência Negra'], ['12-25', 'Natal']];
  function holidaysOf(month) {
    const [y, m] = month.split('-').map(Number), out = [];
    FIXED.forEach(([md, name]) => { if (+md.slice(0, 2) === m) out.push({ day: +md.slice(3), name, national: true, kind: 'nacional' }); });
    const add = (off, name, kind) => { const d = easter(y); d.setDate(d.getDate() + off); if (d.getMonth() + 1 === m) out.push({ day: d.getDate(), name, national: false, kind }); };
    add(-2, 'Sexta-feira da Paixão', 'comum');
    add(-48, 'Carnaval (segunda)', 'facultativo'); add(-47, 'Carnaval (terça)', 'facultativo'); add(60, 'Corpus Christi', 'facultativo');
    return out.sort((a, b) => a.day - b.day);
  }

  function dayInfo(cfg, d) {
    const wd = wdOf(cfg.month, d), w = cfg.week[wd];
    let open = !!w.open, start = w.start, end = w.end;
    const ex = cfg.exceptions && cfg.exceptions[d];
    if (ex !== undefined) { if (ex === false) open = false; else { open = true; if (typeof ex === 'object') { start = ex.start; end = ex.end; } } }
    if (cfg.mode === '12x36') {
      const s = cfg.s12 || { start: 420, night: false };
      return { open, start: s.night ? 0 : s.start, end: s.night ? 1440 : s.start + 720, wd };
    }
    // fechado para almoço (ou outra pausa da loja): faixa dentro do expediente em que não é preciso ninguém
    let gap = null;
    if (open && cfg.closed && cfg.closed.end > cfg.closed.start && start < cfg.closed.start && end > cfg.closed.end) gap = { start: cfg.closed.start, end: cfg.closed.end }; // só vale nos dias em que a loja reabre depois do almoço
    return { open, start, end, wd, gap };
  }
  const inGap = (info, m) => !!(info && info.gap && m >= info.gap.start && m < info.gap.end);

  // Limite semanal em vigor por data (EC 141/2026, art. 6º: 42h dois meses após a publicação, 40h um ano depois).
  const LEGAL = [['1900-01-01', 44], ['2026-12-16', 42], ['2027-12-16', 40]];
  function legalWeekly(month, d) {
    const key = `${month}-${String(d).padStart(2, '0')}`; let w = 44;
    LEGAL.forEach(([from, h]) => { if (key >= from) w = h; });
    return w;
  }

  function breakFor(work, brk) { return work <= 240 ? 0 : brk; }
  /* Jornada de cada pessoa: p.jr = { work, dpw, brk, sat } (todos opcionais; sem p.jr vale a jornada da empresa). sat = horas no sábado, se diferente. */
  function jrOf(cfg, p) { const j = (p && p.jr) || {}; return { work: j.work != null ? j.work : cfg.work, dpw: j.dpw != null ? j.dpw : cfg.daysPerWeek, brk: j.brk != null ? j.brk : cfg.brk, sat: j.sat != null ? j.sat : null }; }
  function workOn(cfg, p, wd) { const j = jrOf(cfg, p); return wd === 6 && j.sat != null ? j.sat : j.work; }
  function brkOn(cfg, p, wd) { return breakFor(workOn(cfg, p, wd), jrOf(cfg, p).brk); }
  function targetOf(cfg, p) { const j = jrOf(cfg, p); return j.sat != null && j.dpw >= 6 ? (j.dpw - 1) * j.work + j.sat : j.work * j.dpw; }

  // semana de segunda a domingo: índice da semana de cada dia
  function weekIndex(month, d) {
    const first = wdOf(month, 1); const offset = (first + 6) % 7; // segunda=0
    return Math.floor((d - 1 + offset) / 7);
  }

  function roleOf(p) { return p.role || '_'; }
  function needOf(cfg, role) { return cfg.need[role] ?? cfg.need._ ?? 1; }

  /* Escolhe entrada e início de pausa que mais reduzem o déficit de cobertura. */
  function pickShift(def, info, workMin, brkMin, minEntry, prefEntry, maxExit) {
    const span = info.end - info.start;
    let work = workMin, brk = brkMin;
    if (work + brk > span) { work = span - brk; if (work <= 240) { work = Math.min(workMin, span); brk = 0; } }
    const L = work + brk;
    const gain = new Float64Array(1441);
    for (let m = 0; m < 1440; m++) gain[m + 1] = gain[m] + (def[m] > 0 ? 2 * def[m] - 1 : 0);
    const lastEntry = info.end - L;
    const cands = [];
    if (prefEntry != null && prefEntry >= info.start && prefEntry <= lastEntry) cands.push(prefEntry);
    else {
      for (let e = info.start; e <= lastEntry; e += GRID) cands.push(e);
      if (cands[cands.length - 1] !== lastEntry) cands.push(lastEntry);
    }
    let best = null;
    for (const e of cands) {
      const violates = e < minEntry || (maxExit && e + L > maxExit);
      const breaks = [];
      if (brk > 0) {
        const lo = e + 120, hi = e + L - brk - 120;
        if (hi >= lo) for (let b = lo; b <= hi; b += BRK_STEP) breaks.push(b);
        else breaks.push(e + Math.floor((L - brk) / 2));
      } else breaks.push(null);
      for (const b of breaks) {
        let v = gain[e + L] - gain[e];
        if (b != null) v -= gain[b + brk] - gain[b];
        const score = v - (violates ? 1e6 : 0) - (prefEntry != null && e !== prefEntry ? 0.1 : 0);
        if (!best || score > best.score + 1e-9) best = { score, e, b, L, work, brk, violates };
      }
    }
    return best && { entry: best.e, exit: best.e + best.L, brkStart: best.b, brk: best.brk, work: best.work, violates: best.violates };
  }

  function addCoverage(def, sh, sign) {
    for (let m = sh.entry; m < sh.exit; m++) {
      if (sh.brkStart != null && m >= sh.brkStart && m < sh.brkStart + sh.brk) continue;
      def[m] += sign; // def = necessidade restante (diminui quando alguém cobre)
    }
  }


  /* Cobertura (pessoas presentes por minuto) de um dia/função, incluindo turnos da noite anterior que passam da meia-noite. */
  function dayCov(cfg, plan, edits, day, role, over) {
    const cov = new Int16Array(1440);
    const get = (pid, d) => (over && over[pid] && d === over.__day ? over[pid] : null) || (edits && edits[pid] && edits[pid][d]) || (plan.cells[pid] && plan.cells[pid][d]);
    cfg.people.forEach((p) => {
      if (roleOf(p) !== role) return;
      [[day, 0], [day - 1, 1]].forEach(([d, sh]) => {
        if (d < 1) return;
        const c = get(p.id, d); if (!c || c.s !== 'work') return;
        if (sh === 1 && c.exit <= 1440) return;
        for (let m = c.entry; m < c.exit; m++) {
          if (c.brkStart != null && m >= c.brkStart && m < c.brkStart + c.brk) continue;
          const a = m - sh * 1440; if (a >= 0 && a < 1440) cov[a]++;
        }
      });
    });
    return cov;
  }

  /* 12x36: 12h de trabalho, 36h de folga, alternando dias. */
  function generate12(cfg) {
    const N = daysInMonth(cfg.month), s12 = cfg.s12 || { start: 420, night: false };
    const starts = s12.night ? [s12.start, (s12.start + 720) % 1440] : [s12.start];
    const brk = cfg.brk ?? 60;
    const people = cfg.people, roles = [...new Set(people.map(roleOf))];
    const cells = {}; people.forEach((p) => (cells[p.id] = {}));
    const days = [], meta = {};
    roles.forEach((r) => {
      const group = people.filter((p) => roleOf(p) === r), cnt = [0, 0], par = {};
      group.forEach((p) => { const cy = cfg.carry && cfg.carry[p.id]; if (cy) { par[p.id] = cy.consec > 0 ? 0 : 1; cnt[par[p.id]]++; } });
      group.forEach((p) => { if (par[p.id] === undefined) { par[p.id] = cnt[0] <= cnt[1] ? 0 : 1; cnt[par[p.id]]++; } });
      [0, 1].forEach((pp) => group.filter((p) => par[p.id] === pp).forEach((p, j) => {
        meta[p.id] = { start: starts[j % starts.length], par: pp, off: 240 + 30 * (j % 4) };
      }));
    });
    for (let d = 1; d <= N; d++) {
      const info = dayInfo(cfg, d); days.push({ day: d, ...info, week: weekIndex(cfg.month, d) });
      people.forEach((p) => {
        const m = meta[p.id];
        if (!info.open) cells[p.id][d] = { s: 'off', why: 'fechado' };

          const sh = pickShift(dd, info, workOn(cfg, x.p, info.wd), brkOn(cfg, x.p, info.wd), x.minEntry, pe(x.p), 0);
          if (sh) { addCoverage(dd, sh, -1); shifts[x.p.id] = sh; } else addCoverage(dd, c, -1);
        });
        let deficit = 0; roles.forEach((r) => { for (let m = info.start; m < info.end; m++) if (def[r][m] > 0) deficit += def[r][m]; });
        return { shifts, deficit };
      };
      let best = dayRun(null);
      if (best.deficit > 0 && order.length > 1) {
        outer: for (const x of order) for (const e of [info.start, Math.max(info.start, info.end - (workOn(cfg, x.p, info.wd) + brkOn(cfg, x.p, info.wd)))]) {
          if (x.p.entry != null) continue;
          const r2 = dayRun({ [x.p.id]: e }); if (r2.deficit < best.deficit) { best = r2; if (best.deficit === 0) break outer; }
        }
      }
      const dayNeed = roles.reduce((m, r) => m + needOf(cfg, r), 0) * (info.end - info.start - (info.gap ? info.gap.end - info.gap.start : 0));
      if (search && best.deficit > 0 && best.deficit <= 0.3 * dayNeed && order.length > 1) { // equipe pequena demais (falta muito): não adianta buscar
        // busca local: tenta outros horários de entrada, pessoa por pessoa (respeitando as 11h de descanso), mantendo o que melhora
        const forced = {}; let budget = 45; // limite de tentativas por dia (mantém o cálculo rápido)
        for (let pass = 0; pass < 3 && best.deficit > 0 && budget > 0; pass++) {
          let improved = false;
          for (const x of order) {
            if (x.p.entry != null) continue;
            const L = workOn(cfg, x.p, info.wd) + brkOn(cfg, x.p, info.wd), last = info.end - L;
            const cands = [Math.max(info.start, x.minEntry)];
            for (let e = info.start; e <= last; e += 60) if (e >= x.minEntry) cands.push(e);
            if (last >= x.minEntry) cands.push(last);
            for (const e of cands) {
              if (e > last || (forced[x.p.id] === e)) continue;
              if (--budget < 0) break;
              const r2 = dayRun({ ...forced, [x.p.id]: e });
              if (r2.deficit < best.deficit) { best = r2; forced[x.p.id] = e; improved = true; if (best.deficit === 0) break; }
            }
            if (best.deficit === 0) break;
          }
          if (!improved) break;
        }
      }
      order.forEach((x) => {
        const s = st[x.p.id], sh = best.shifts[x.p.id];
        if (!sh) { cells[x.p.id][d] = { s: 'off', why: 'sem horário' }; return; }
        cells[x.p.id][d] = { s: 'work', ...sh };
        s.workedWeek[w] = (s.workedWeek[w] || 0) + 1; s.consec += 1; s.lastExit = sh.exit; s.lastDay = d;
        if (isSun) s.sundays += 1;
      });
      people.forEach((p) => {
        if (!cells[p.id][d]) { cells[p.id][d] = { s: 'off', why: 'folga' }; st[p.id].consec = 0; }
        st[p.id].hist[d] = cells[p.id][d].s === 'work' ? 1 : 0;
        if (info.wd === 0) { const wk0 = cells[p.id][d].s === 'work'; st[p.id].sunStreak = wk0 ? st[p.id].sunStreak + 1 : 0; if (!wk0) st[p.id].sunOffMonth = true; }
      });
    }

    // pessoas com menos dias que o contrato
    people.forEach((p) => {
      const missing = Object.keys(openByWeek).some((w) => (st[p.id].workedWeek[w] || 0) < quotaOf(p, +w));
      if (missing) notes.push(`${p.name} ficou com menos dias que a jornada prevê (restrições de dias ou limite de 6 dias seguidos).`);
    });
    return { cells, days, notes };
  }

  /* Analisa: cobertura, lacunas, verificações trabalhistas, resumo por pessoa. */
  function analyze(cfg, plan, edits) {
    const N = daysInMonth(cfg.month);
    const people = cfg.people;
    const roles = [...new Set(people.map(roleOf))];
    const eff = (pid, d) => (edits && edits[pid] && edits[pid][d]) || plan.cells[pid][d];
    const gaps = [];
    let neededMin = 0, missingMin = 0;
    const perDayGapDays = new Set();
    for (let d = 1; d <= N; d++) {
      const info = plan.days[d - 1];
      if (!info.open) continue;
      roles.forEach((r) => {
        const need = needOf(cfg, r), cov = dayCov(cfg, plan, edits, d, r);
        let runStart = null, runMiss = 0, runHave = 0;
        for (let m = info.start; m <= info.end; m++) {
          const nd = inGap(info, m) ? 0 : need, miss = m < info.end ? Math.max(0, nd - cov[m]) : 0;
          if (m < info.end) { neededMin += nd; missingMin += miss; }
          if (miss > 0 && runStart === null) { runStart = m; runMiss = miss; runHave = cov[m]; }
          else if (runStart !== null && (miss === 0 || miss !== runMiss)) {
            gaps.push({ day: d, role: r, from: runStart, to: m, have: runHave, need, miss: runMiss });
            runStart = miss > 0 ? m : null; runMiss = miss; runHave = cov[m];
          }
        }
        if (runStart !== null) gaps.push({ day: d, role: r, from: runStart, to: info.end, have: runHave, need, miss: runMiss });
      });
    }
    gaps.forEach((g) => perDayGapDays.add(g.day));

    // por pessoa
    const perPerson = {}, checks = { consec: [], rest: [], weekly: [], daily: [], intervalo: [], win: [], sun: [] };
    const brk = breakFor(cfg.work, cfg.brk);
    people.forEach((p) => {
      const cy = (cfg.carry && cfg.carry[p.id]) || {};
      let total = 0, sundays = 0, run = cy.consec || 0, maxRun = run, workDays = 0, lastExit = cy.lastExit ?? null, lastDay = 0;
      const weekMin = {};
      for (let d = 1; d <= N; d++) {
        const c = eff(p.id, d);
        if (c.s === 'work') {
          const mins = c.exit - c.entry - (c.brk || 0);
          total += mins; workDays++; run++; maxRun = Math.max(maxRun, run);
          const w = weekIndex(cfg.month, d); weekMin[w] = (weekMin[w] || 0) + mins;
          if (plan.days[d - 1].wd === 0) sundays++;
          if (lastExit != null && d - lastDay <= 2) {
            const rest = (d - lastDay) * 1440 + c.entry - lastExit;
            if (rest < 660) checks.rest.push({ p: p.name, day: d, rest });
          }
          if (cfg.mode !== '12x36' && mins > 600) checks.daily.push({ p: p.name, day: d, mins });
          lastExit = c.exit; lastDay = d;
          if (maxRun === 7 && run === 7) checks.consec.push({ p: p.name, day: d });
        } else run = 0;
      }
      const dpwA = jrOf(cfg, p).dpw;
      if (cfg.rolling && cfg.mode !== '12x36' && dpwA < 7) {
        const w = []; for (let d = 1; d <= N; d++) w[d] = eff(p.id, d).s === 'work' ? 1 : 0;
        for (let d = 7; d <= N; d++) { let c = 0; for (let k = d - 6; k <= d; k++) c += w[k]; if (c > dpwA) { checks.win.push({ p: p.name, day: d, n: c }); break; } }
      }
      if (cfg.mode !== '12x36') {
        const rule = cfg.sunRule || 'month', mx = rule === 'w2' ? 1 : rule === 'w3' ? 2 : 99;
        let sk = cy.sunStreak || 0, offM = false, openN = 0, lastOpen = 0;
        for (let d = 1; d <= N; d++) {
          if (plan.days[d - 1].wd !== 0) continue;
          if (!plan.days[d - 1].open) { sk = 0; offM = true; continue; }
          openN++; lastOpen = d; const wk1 = eff(p.id, d).s === 'work';
          sk = wk1 ? sk + 1 : 0; if (!wk1) offM = true;
          if (sk > mx) { checks.sun.push({ p: p.name, day: d, n: sk, rule }); break; }
        }
        if (rule === 'month' && openN > 0 && !offM) checks.sun.push({ p: p.name, day: lastOpen, n: openN, rule });
      }
      perPerson[p.id] = { total, sundays, maxRun, workDays, weekMin };
    });
    if (cfg.mode !== '12x36') people.forEach((p) => {
      const target = targetOf(cfg, p);
      const wm = perPerson[p.id].weekMin;
      Object.keys(wm).forEach((w) => {
        const days = plan.days.filter((x) => x.week === +w).length;
        if (days < 7) return; // semana incompleta não é avaliada
        const firstDay = plan.days.find((x) => x.week === +w).day, lim = legalWeekly(cfg.month, firstDay) * 60;
        if (wm[w] > lim) checks.weekly.push({ p: p.name, week: +w, mins: wm[w], target: lim });
        if (wm[w] > target) perPerson[p.id].extra = (perPerson[p.id].extra || 0) + (wm[w] - target);
      });
    });
    let coveragePct = neededMin ? Math.round(100 * (1 - missingMin / neededMin)) : 100;
    if (missingMin > 0) coveragePct = Math.min(99, coveragePct);
    return { gaps, gapDays: perDayGapDays, neededMin, missingMin, coveragePct, perPerson, checks, brk };
  }

  /* Quem pode cobrir um dia: pessoas de folga/sem turno naquele dia da mesma função. */
  function candidates(cfg, plan, edits, day, role) {
    const eff = (pid, d) => (edits && edits[pid] && edits[pid][d]) || plan.cells[pid][d];
    const out = [];
    cfg.people.forEach((p) => {
      if (roleOf(p) !== role && role !== '*') return;
      const c = eff(p.id, day);
      if (c.s === 'work') return;
      if (c.s === 'absent') return;
      const wd = plan.days[day - 1].wd;
      if (p.blockedWd.includes(wd)) return;
      // dias seguidos se trabalhar hoje
      let before = 0; for (let d = day - 1; d >= 1 && eff(p.id, d).s === 'work'; d--) before++;
      let after = 0; for (let d = day + 1; d <= plan.days.length && eff(p.id, d).s === 'work'; d++) after++;
      const run = before + 1 + after;
      const w = weekIndex(cfg.month, day);
      let wk = 0, wdays = 0; plan.days.filter((x) => x.week === w).forEach((x) => { const cc = eff(p.id, x.day); if (cc.s === 'work') { wk += cc.exit - cc.entry - (cc.brk || 0); wdays++; } });
      const add = Math.min(workOn(cfg, p, plan.days[day - 1].wd), plan.days[day - 1].end - plan.days[day - 1].start);
      const target = targetOf(cfg, p), dpwC = jrOf(cfg, p).dpw;
      let winOk = true;
      if (cfg.rolling && cfg.mode !== '12x36' && dpwC < 7) {
        const wk2 = []; for (let d = 1; d <= plan.days.length; d++) wk2[d] = (d === day) ? 1 : (eff(p.id, d).s === 'work' ? 1 : 0);
        for (let end = Math.max(7, day); end <= Math.min(plan.days.length, day + 6); end++) { let c = 0; for (let k = end - 6; k <= end; k++) c += wk2[k]; if (c > dpwC) { winOk = false; break; } }
      }
      out.push({ p, run, weekAfter: wk + add, target, okRun: run <= 6, okWeek: wk + add <= target + 1 && winOk && (wdays + 1 <= dpwC || plan.days.filter((x) => x.week === w).length < 7), hasHoliday: c.why === 'fechado' });
    });
    return out.sort((a, b) => (b.okRun - a.okRun) || (b.okWeek - a.okWeek) || (a.weekAfter - b.weekAfter));
  }

  /* Cria um turno ideal para alguém entrar em um dia (para "cobrir"). */
  function bestShiftFor(cfg, plan, edits, pid, day) {
    const eff = (id, d) => (edits && edits[id] && edits[id][d]) || plan.cells[id][d];
    const p = cfg.people.find((x) => x.id === pid), role = roleOf(p), info = plan.days[day - 1];
    if (cfg.mode === '12x36') {
      const s12 = cfg.s12 || { start: 420, night: false }, brk = cfg.brk ?? 60;
      const starts = s12.night ? [s12.start, (s12.start + 720) % 1440] : [s12.start]; let best = null;
      starts.forEach((st) => {
        const cell = { entry: st, exit: st + 720, brkStart: brk ? st + 240 : null, brk, work: 720 - brk };
        const m = missingFor(cfg, plan, edits, day, role, { [pid]: { s: 'work', ...cell } });
        if (!best || m < best.m) best = { m, cell };
      });
      return best && best.cell;
    }
    const def = new Int16Array(1441); for (let m = info.start; m < info.end; m++) def[m] = inGap(info, m) ? 0 : needOf(cfg, role);
    cfg.people.filter((q) => roleOf(q) === role && q.id !== pid).forEach((q) => {
      const c = eff(q.id, day); if (c.s === 'work') addCoverage(def, c, -1);
    });
    const prev = day > 1 ? eff(pid, day - 1) : null;
    const minEntry = prev && prev.s === 'work' ? prev.exit + 660 - 1440 : 0;
    const nx = day < plan.days.length ? eff(pid, day + 1) : null;
    const maxExit = nx && nx.s === 'work' ? nx.entry + 1440 - 660 : 0;
    return pickShift(def, info, workOn(cfg, p, info.wd), brkOn(cfg, p, info.wd), minEntry, p.entry, maxExit);
  }


  /* Estado do fim do mês para continuar no mês seguinte. */
  function carryFrom(cfg, plan, edits) {
    const N = daysInMonth(cfg.month), out = {};
    const eff = (pid, d) => (edits && edits[pid] && edits[pid][d]) || plan.cells[pid][d];
    cfg.people.forEach((p) => {
      let run = 0, sundays = 0, sk = (cfg.carry && cfg.carry[p.id] && cfg.carry[p.id].sunStreak) || 0;
      for (let d = 1; d <= N; d++) { const c = eff(p.id, d); if (c.s === 'work') { run++; if (plan.days[d - 1].wd === 0) sundays++; } else run = 0; if (plan.days[d - 1].wd === 0) sk = plan.days[d - 1].open && c.s === 'work' ? sk + 1 : 0; }
      const last = eff(p.id, N);
      out[p.id] = { consec: run, sundays, sunStreak: sk, lastExit: last.s === 'work' ? last.exit : null };
    });
    return out;
  }

  function missingFor(cfg, plan, edits, day, role, over) {
    const info = plan.days[day - 1], need = needOf(cfg, role);
    const o = over ? { ...over, __day: day } : null;
    const cov = dayCov(cfg, plan, edits, day, role, o);
    let miss = 0; for (let m = info.start; m < info.end; m++) if (!inGap(info, m)) miss += Math.max(0, need - cov[m]); return miss;
  }

  /* Sugestões para um dia com lacuna: mover pausa (sem custo) e hora extra (até 2h/dia, máx. 10h, 11h de descanso). */
  function suggestions(cfg, plan, edits, day, role) {
    const eff = (pid, d) => (edits && edits[pid] && edits[pid][d]) || plan.cells[pid][d];
    const info = plan.days[day - 1], before = missingFor(cfg, plan, edits, day, role), pause = [], extra = [];
    cfg.people.filter((p) => roleOf(p) === role).forEach((p) => {
      const c = eff(p.id, day); if (c.s !== 'work') return;
      // mover pausa
      if (c.brkStart != null) {
        let best = null;
        for (let b = Math.ceil((c.entry + 120) / 15) * 15; b <= c.exit - c.brk - 120; b += 15) {
          if (b === c.brkStart) continue;
          const after = missingFor(cfg, plan, edits, day, role, { [p.id]: { ...c, brkStart: b } });
          if (after < before && (!best || after < best.after)) best = { p, cell: { ...c, brkStart: b }, after, label: `pausa às ${fmt(b)}` };
        }
        if (best) pause.push(best);
      }
      // hora extra
      const workMin = c.exit - c.entry - (c.brk || 0), room = Math.min(120, 600 - workMin); if (room <= 0 || cfg.mode === '12x36') return;
      let bestE = null;
      for (let k = 30; k <= room; k += 30) {
        const opts = [];
        const ne = Math.ceil((c.exit + k) / 15) * 15, kx = ne - c.exit; const nx = day < plan.days.length ? eff(p.id, day + 1) : null;
        if (ne <= info.end && !(nx && nx.s === 'work' && nx.entry + 1440 - ne < 660)) opts.push({ cell: { ...c, exit: ne }, label: `fica até ${fmt(ne)}`, k: kx });
        const nn = Math.floor((c.entry - k) / 15) * 15, kn = c.entry - nn; const pv = day > 1 ? eff(p.id, day - 1) : null;
        if (nn >= info.start && !(pv && pv.s === 'work' && nn + 1440 - pv.exit < 660)) opts.push({ cell: { ...c, entry: nn, brkStart: c.brkStart != null ? c.brkStart : null }, label: `chega às ${fmt(nn)}`, k: kn });
        opts.forEach((o) => { const after = missingFor(cfg, plan, edits, day, role, { [p.id]: o.cell }); if (o.k <= room && after < before && (!bestE || after < bestE.after || (after === bestE.after && o.k < bestE.k))) bestE = { p, cell: o.cell, after, k: o.k, label: o.label, dayMax: workMin + o.k }; });
      }
      if (bestE) extra.push(bestE);
    });
    pause.sort((a, b) => a.after - b.after); extra.sort((a, b) => a.after - b.after || a.k - b.k);
    return { before, pause, extra, holiday: info.wd === 0 || (cfg.holidays || []).includes(day) };
  }

  /* Resultado de escalar alguém em um dia: turno ideal e quanto ainda falta naquele dia. */
  function evalCover(cfg, plan, edits, pid, day, role) {
    const sh = bestShiftFor(cfg, plan, edits, pid, day); if (!sh) return null;
    const cell = { s: 'work', ...sh };
    return { cell, after: missingFor(cfg, plan, edits, day, role, { [pid]: cell }) };
  }

  /* Valida uma alteração: não pode criar falta em outro dia nem novos alertas (6 dias seguidos, 11h de descanso, limite diário). */
  function checkEdit(cfg, plan, edits, pid, day, cell, allowWeekly) {
    const base = analyze(cfg, plan, edits);
    const e2 = { ...(edits || {}) }; e2[pid] = { ...(e2[pid] || {}), [day]: cell };
    const a2 = analyze(cfg, plan, e2);
    for (const d of a2.gapDays) if (!base.gapDays.has(d)) return { ok: false, why: 'cria falta no dia ' + d };
    if (a2.missingMin > base.missingMin) return { ok: false, why: 'aumenta a falta' };
    const k = (a, n) => a.checks[n].length;
    for (const n of ['consec', 'rest', 'daily', 'win', 'sun']) if (k(a2, n) > k(base, n)) return { ok: false, why: n };
    if (!allowWeekly && k(a2, 'weekly') > k(base, 'weekly')) return { ok: false, why: 'weekly' };
    return { ok: true, after: a2.missingMin };
  }

  /* Quantas pessoas a mais fecham as lacunas (teste com pessoas fictícias). */
  /* Limite inferior PROVADO de pessoas (com menos que isso é impossível): soma, dia a dia, dos turnos mínimos (minutos de cobertura ÷ o máximo de trabalho de um turno), dividida pelos dias que uma pessoa pode trabalhar no mês. */
  function minPeopleLB(cfg) {
    if (cfg.mode === '12x36' || !cfg.people.length) return null;
    const N = daysInMonth(cfg.month), roles = [...new Set(cfg.people.map(roleOf))], openByWeek = {};
    let maxWork = 0; cfg.people.forEach((p) => { const j = jrOf(cfg, p); maxWork = Math.max(maxWork, j.work, j.sat != null ? j.sat : 0); }); maxWork = Math.max(maxWork, cfg.work);
    let shifts = 0;
    for (let d = 1; d <= N; d++) {
      const info = dayInfo(cfg, d); if (!info.open) continue;
      const w = weekIndex(cfg.month, d); openByWeek[w] = (openByWeek[w] || 0) + 1;
      const span = info.end - info.start - (info.gap ? info.gap.end - info.gap.start : 0);
      const perShift = Math.min(maxWork, span);
      roles.forEach((r) => { shifts += Math.ceil((needOf(cfg, r) * span) / perShift); });
    }
    const capDays = (p) => { const j = jrOf(cfg, p); return Object.values(openByWeek).reduce((m, o) => m + Math.min(j.dpw, o), 0); };
    const maxCap = Math.max(...cfg.people.map(capDays), capDays({}));
    return maxCap > 0 ? Math.ceil(shifts / maxCap) : null;
  }
  function extraPeopleNeeded(cfg, max = 6) {
    // limite inferior: minutos de cobertura necessários ÷ o máximo que uma pessoa consegue trabalhar no mês (pula tentativas impossíveis)
    let kStart = 0;
    if (cfg.mode !== '12x36' && cfg.people.length) {
      const a0 = analyze(cfg, generate(cfg), null), N = daysInMonth(cfg.month), openByWeek = {};
      for (let d = 1; d <= N; d++) if (dayInfo(cfg, d).open) { const w = weekIndex(cfg.month, d); openByWeek[w] = (openByWeek[w] || 0) + 1; }
      const cap = (p) => { const j = jrOf(cfg, p); return Object.values(openByWeek).reduce((m, o) => m + Math.min(j.dpw, o) * j.work, 0); };
      const maxCap = Math.max(...cfg.people.map(cap), cap({}));
      if (maxCap > 0) kStart = Math.max(0, Math.ceil(a0.neededMin / maxCap) - cfg.people.length);
    }
    if (kStart > max) return null;
    for (let k = kStart; k <= max; k++) {
      const fake = []; for (let i = 0; i < k; i++) fake.push({ id: 'x' + i, name: 'Extra', role: cfg.people[0] ? roleOf(cfg.people[0]) === '_' ? '' : cfg.people[0].role : '', blockedWd: [], entry: null });
      const c2 = { ...cfg, people: [...cfg.people, ...fake] };
      const a = analyze(c2, generate(c2), null);
      if (a.gaps.length === 0) return k;
    }
    return null;
  }

  const api = { minPeopleLB, checkEdit, evalCover, dayCov, carryFrom, suggestions, legalWeekly, generate, analyze, candidates, bestShiftFor, extraPeopleNeeded, holidaysOf, daysInMonth, wdOf, weekIndex, dayInfo, fmt, fmtH, breakFor, jrOf, workOn, brkOn, targetOf, roleOf, needOf };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Engine = api;
})(typeof window !== 'undefined' ? window : globalThis);

 if(c.uf)(STATE_HOL[c.uf]||[]).forEach(([md,n])=>{if(+md.slice(0,2)===m)push({day:+md.slice(3),name:n,kind:'estadual'})});

function validate(c){
 if(!c)return 'Informe um WhatsApp ou e-mail.';
 if(c.includes('@')){if(!/^[^\s@]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(c))return 'Confira o e-mail: parece incompleto.';const d=c.split('@')[1].toLowerCase();if(DISC.some(x=>d===x||d.endsWith('.'+x)))return 'Use um e-mail permanente para guardar sua escala.';return ''}
 let n=c.replace(/\D/g,'');if(c.trim().startsWith('+')&&!c.trim().startsWith('+55'))return 'Aceitamos apenas WhatsApp do Brasil.';
 if(n.length===13&&n.startsWith('55'))n=n.slice(2);

 if(dOK&&h2)return {kind:'full',when,title:'Sua escala atende a nova regra',items,text,btns:[]};
 if(dOK&&h1)return {kind:'partial',when,title:'Sua escala atende a Fase 1',items,text,btns:[B('40')]};

}

 const byWd={};days.forEach(d=>byWd[E.wdOf(c.month,d)]=d);const hol=realHol(c);
 const COLS=ORDER.filter(i=>byWd[i]);
 const head=COLS.map(i=>{const d=byWd[i];return `<th class="dh" title="${esc(hol[d]||'')}"><span class="dw">${WD[i]}</span><span class="dn">${d}</span>${hol[d]&&S.plan.days[d-1].open?'<span class="hbadge">FERIADO</span>':''}${a.gapDays.has(d)?'<span class="gbadge">⚠ falta gente</span>':''}</th>`}).join('');
 const people=cfgForEngine().people;
 const rows=people.map(p=>`<tr><td class="nm"><div class="nmc"><span class="av">${esc((p.name.trim()[0]||'?').toUpperCase())}</span><span>${esc(p.name)}${p.role?`<small>${esc(p.role)}</small>`:''}</span></div></td>${COLS.map(i=>cellHtml(p,byWd[i],detail,!!hol[byWd[i]])).join('')}${detail?`<td>${E.fmtH(days.reduce((s,d)=>{const x=cellOf(p.id,d);return s+(x.s==='work'?x.exit-x.entry-(x.brk||0):0)},0))}</td>`:''}</tr>`).join('');
 return {days,html:`<div class="tw"><table class="sc"><thead><tr><th class="nm">Equipe</th>${head}${detail?'<th>Horas</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`}}

const LEG='<div class="leg"><span class="lg m"></span>Manhã <span class="lg t"></span>Tarde <span class="lg n"></span>Noite <span class="lg hd"></span>Feriado <span class="lg cl"></span>Fechado <span class="lg ed"></span>Ajuste manual</div>';
const nm14=t=>t.length>14?t.slice(0,13)+'…':t;
function calMonth(a,lines){const c=C(),n=E.daysInMonth(c.month),lead=(E.wdOf(c.month,1)+6)%7,cf=cfgForEngine(),rh=realHol(c);
 let cells=ORDER.map(i=>`<div class="ch">${WD[i]}</div>`).join('');for(let k=0;k<lead;k++)cells+='<div class="cc out"></div>';
 for(let d=1;d<=n;d++){const info=S.plan.days[d-1],gap=a.gapDays.has(d),miss=gap?Math.max(...a.gaps.filter(g=>g.day===d).map(g=>g.miss)):0,hol=rh[d]&&info.open;let body='';
  if(!info.open)body=`<div class="cclosed">${rh[d]?esc(rh[d])+'<br>':''}Fechado</div>`;
  else if(!lines){const w=cf.people.map(p=>cellOf(p.id,d)).filter(x=>x.s==='work'),ab=cf.people.filter(p=>cellOf(p.id,d).s==='absent').length;body=`<div class="dots">${w.map(x=>`<i class="${shiftCls(x)}"></i>`).join('')}${'<i class="miss"></i>'.repeat(miss)}</div><div class="txt" style="margin-top:4px">${w.length===1?'1 pessoa':w.length+' pessoas'}</div>${ab?`<div class="txt" style="color:var(--bad)">${ab} falta${ab>1?'s':''}</div>`:''}${miss&&!lines?`<div class="txt" style="color:var(--bad);font-weight:700">falta ${miss}</div>`:''}`}
  else{const work=[],abs=[],fol=[];cf.people.forEach(p=>{const x=cellOf(p.id,d);if(x.s==='work')work.push({p,x});else if(x.s==='absent')abs.push(p);else fol.push(p)});
   work.sort((u,v)=>u.x.entry-v.x.entry);
   body=work.map(({p,x})=>`<div class="pl ${shiftCls(x)}${S.edits[p.id]&&S.edits[p.id][d]?' ed':''}" ${RO()?'':`onclick="editCell('${p.id}',${d})"`}><b>${esc(nm14(p.name))}</b><span>${E.fmt(x.entry)}–${E.fmt(x.exit)}${x.exit>1440?'⁺¹':''}</span></div>`).join('')
    +abs.map(p=>`<div class="pl ab" ${RO()?'':`onclick="editCell('${p.id}',${d})"`}><b>${esc(nm14(p.name))}</b><span>falta</span></div>`).join('')
    +(fol.length?`<div class="cfol">Folga: ${fol.map(p=>esc(nm14(p.name))).join(', ')}</div>`:'')}
  const g=a.gaps.find(x=>x.day===d);
  cells+=`<div class="cc ${gap?'gapc pulse':''} ${!info.open?'closedc':''} ${hol?'holc':''}" ${(!lines&&info.open)?`onclick="openDay(${d})"`:''}><div class="cn"><span>${d}</span>${hol?'<em class="hb2">FERIADO</em>':''}${gap?'<em class="gb2">⚠ falta gente</em>':''}</div>${body}${lines&&gap&&!RO()?`<button class="link" onclick="cover(${d},'${esc(g.role)}')">Ver opções</button>`:''}</div>`}

window.openDay=d=>{const c=C(),info=S.plan.days[d-1];if(!info||!info.open)return;const cf=cfgForEngine(),rh=realHol(c),a=ana(),g=a.gaps.find(x=>x.day===d);
 const G={m:[],t:[],n:[]},abs=[],fol=[];cf.people.forEach(p=>{const x=cellOf(p.id,d);if(x.s==='work')G[shiftCls(x)].push({p,x});else if(x.s==='absent')abs.push(p);else fol.push(p)});

window.nextMonthPrep=()=>{S.sim=null;const c=C();c.carry=E.carryFrom(cfgForEngine(),S.plan,S.edits);const [y,m]=c.month.split('-').map(Number),d=new Date(y,m,1);c.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');c.exceptions={};holInit={};ensureHolidays();S.edits={};S.version=1;S.memo='';compute();S.dayNo=firstOpen();S.weekNo=E.weekIndex(c.month,S.dayNo);S.view='month';save();renderResult();window.scrollTo(0,0);
 const lim=E.legalWeekly(c.month,1);modal(`<h2>${MONTHS[+c.month.slice(5)-1][0].toUpperCase()+MONTHS[+c.month.slice(5)-1].slice(1)} preparado</h2><p>Continuamos de onde o mês anterior terminou: dias seguidos, descanso entre jornadas e rodízio de domingos já foram considerados.</p><ul><li>Feriados nacionais marcados como <b>fechados</b>. Confira feriados locais em “Mudar equipe, jornada ou horários”.</li><li>Limite semanal em vigor neste mês: <b>${lim}h</b>.</li></ul><button class="pri" onclick="closeModal()">Ver a escala</button>`)};
window.saveFile=()=>{const payload=JSON.stringify({c:S.cfg,e:S.edits,v:S.version,m:S.memo,app:'criar-escala-v2'});const b=new Blob([payload],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='escala-'+C().month+'.criarescala.json';a.click();toast('Arquivo salvo. Use “Abrir escala salva” para continuar depois.')};
window.firstTime=()=>{closeModal();startWizard();toast('No passo 3, toque em “Informar última semana”.')};
window.openSaved=()=>modal(`<h2>Continuar de um mês anterior</h2><div class="opts" style="margin-bottom:12px"><div class="opt" onclick="firstTime()"><b>Nunca usei o Criar Escala</b><span>Informo como foi a última semana do mês passado</span></div></div><h3>Já usei: abrir escala salva</h3><p>Escolha o arquivo baixado (.criarescala.json) ou cole o link compartilhado. Depois é só tocar em “Continuar para o próximo mês”.</p>
 <input type="file" id="sf" accept=".json,application/json" onchange="loadFile(this.files[0])"><p class="hint" style="margin-top:12px">ou cole o link:</p><input id="sl" placeholder="https://…#e=…"><div class="err" id="serr"></div><button class="pri" onclick="loadLink()">Abrir pelo link</button>`);
function adopt(d){S={step:0,cfg:d.c,plan:null,edits:d.e||{},version:d.v||1,memo:d.m||'',view:'month',weekNo:0,dayNo:1};readOnly=false;started=true;compute();S.dayNo=firstOpen();S.weekNo=E.weekIndex(C().month,S.dayNo);save();closeModal();renderResult()}
window.loadFile=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.c||!d.c.people)throw 0;adopt(d)}catch{document.getElementById('serr').textContent='Arquivo não reconhecido.'}};r.readAsText(f)};
window.loadLink=()=>{try{const v=document.getElementById('sl').value,i=v.indexOf('#e=');adopt(JSON.parse(decodeURIComponent(escape(atob(v.slice(i+3))))))}catch{document.getElementById('serr').textContent='Link não reconhecido.'}};

window.editCell=(pid,d)=>{const p=cfgForEngine().people.find(x=>x.id===pid),x=cellOf(pid,d),info=S.plan.days[d-1];
 if(!info.open)return toast('A empresa está fechada neste dia. Para abrir, use “Mudar equipe, jornada ou horários”.');
 const others=cfgForEngine().people.filter(q=>q.id!==pid&&cellOf(q.id,d).s!=='work'&&cellOf(q.id,d).s!=='absent');
 modal(`<h2>${esc(p.name)} · ${dayLabel(d)}</h2><div class="opts" style="margin:10px 0">
 <div class="opt ${x.s==='work'?'sel':''}" onclick="applyCell('${pid}',${d},'work')"><b>Trabalha</b><span>${x.s==='work'?E.fmt(x.entry)+'–'+E.fmt(x.exit):'escolher melhor horário'}</span></div>
 <div class="opt ${x.s==='off'?'sel':''}" onclick="applyCell('${pid}',${d},'off')"><b>Folga</b><span>não trabalha neste dia</span></div>
 <div class="opt ${x.s==='absent'?'sel':''}" onclick="applyCell('${pid}',${d},'absent')"><b>Faltou</b><span>falta ou atestado</span></div></div>

/* ---------- Última semana do mês anterior ---------- */
function prevDays(){const [y,m]=C().month.split('-').map(Number);return Array.from({length:7},(_,i)=>{const d=new Date(y,m-1,1-(7-i));return {wd:d.getDay(),label:WD[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)}})}
function prevCard(){const c=C();return `<div class="box info" style="margin-top:14px"><b>Já tinha uma escala em andamento?</b> Informe a última semana antes desta nova escala, para calcularmos corretamente as folgas e os dias seguidos no início do mês, conforme as normas. <button class="link" onclick="prevWeek()">${c.prevWeek?'✔ Editar última semana':'Informar última semana'}</button></div>`}
window.prevWeek=()=>{const c=C(),days=prevDays(),pw=c.prevWeek||{};
 const grid=c.people.map((p,pi)=>{const row=(pw.g&&pw.g[p.id])||days.map((x,i)=>c.mode==='12x36'?(i+pi)%2===0:c.week[x.wd].open);return `<tr><td class="nm">${esc(p.name)}</td>${row.map((v,i)=>`<td class="w pw" data-p="${p.id}" data-i="${i}" data-v="${v?1:0}" onclick="pwTog(this)" style="${v?'':'background:#fafbfc;color:#98a1b2'}">${v?'Trabalhou':'Folga'}</td>`).join('')}</tr>`}).join('');
 modal(`<h2>Última semana do mês anterior</h2><p class="hint">Toque para alternar entre <b>Trabalhou</b> e <b>Folga</b>. Já deixamos marcado conforme os dias de funcionamento; corrija o que for diferente.</p>
 <div class="tw"><table class="sc"><thead><tr><th class="nm">Equipe</th>${days.map(x=>`<th>${x.label}</th>`).join('')}</tr></thead><tbody>${grid}</tbody></table></div>
 <label for="pwx">Quem trabalhou no último dia saiu às</label><input type="time" id="pwx" value="${E.fmt(pw.exit??c.week[days[6].wd].end)}">
 <div class="nav"><span></span><button class="pri" onclick="pwSave()">Salvar</button></div>`)};
window.pwTog=td=>{const v=td.dataset.v==='1'?0:1;td.dataset.v=v;td.textContent=v?'Trabalhou':'Folga';td.style.background=v?'':'#fafbfc';td.style.color=v?'':'#98a1b2'};
window.pwSave=()=>{const c=C(),days=prevDays(),g={},ex=tm(document.getElementById('pwx').value),exit=isNaN(ex)?1080:ex;
 document.querySelectorAll('td.pw').forEach(td=>{(g[td.dataset.p]=g[td.dataset.p]||[])[+td.dataset.i]=td.dataset.v==='1'});
 const carry={};c.people.forEach(p=>{const r=g[p.id]||[];let run=0;for(let i=6;i>=0&&r[i];i--)run++;const sun=r.filter((v,i)=>v&&days[i].wd===0).length;
  carry[p.id]={consec:run,sundays:sun,sunStreak:days.some((x,i)=>x.wd===0&&r[i])?1:0,lastExit:r[6]?(c.mode==='12x36'?(c.s12?.start??420)+720:exit):null}});
 c.prevWeek={g,exit};c.carry=carry;save();closeModal();renderWizard();toast('Última semana registrada.')};

/* ---------- Início ---------- */
document.addEventListener('click',e=>{if(!e.target.closest('.mwrap'))document.querySelectorAll('.menu').forEach(m=>m.hidden=true)});
function init(){load();window.S_=()=>S;window.closeModal=closeModal;
 const h=location.hash;if(h.startsWith('#e=')){try{const d=JSON.parse(decodeURIComponent(escape(atob(h.slice(3)))));readOnly=true;S={step:0,cfg:d.c,plan:null,edits:d.e||{},version:d.v||1,memo:d.m||'',view:'month',weekNo:0,dayNo:1};compute();renderResult();
   if(S.memo)$('app').insertAdjacentHTML('afterbegin',`<div class="box warn"><b>Recado:</b> ${esc(S.memo)}</div>`);return}catch{toast('Link inválido.')}}
 if(S.plan===null&&started)compute();renderLanding()}
window.openPrefs=window.openPrefs;
init();
})();
</script>
</body>
</html>
